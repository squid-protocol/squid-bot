<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-label="squid-protocol/gitgalaxy PR quality by size">
<style>
  .root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
          --axis:#c3c2b7; --border:rgba(11,11,11,0.10); --tile:#f4f3f0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
          --neutral:#c3c2b7; --failed:#d03b3b; --good:#0ca30c; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
            --axis:#383835; --border:rgba(255,255,255,0.10); --tile:#232322; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
            --neutral:#5c5c58; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); stroke: var(--border); }
  .tile { fill: var(--tile); }
  .h1 { font-size: 16px; font-weight: 650; }
  .lead { font-size: 12.5px; fill: var(--ink2); }
  .h2 { font-size: 12.5px; font-weight: 600; }
  .meta, .tick, .lbl { font-size: 10.5px; fill: var(--muted); }
  .tick { font-variant-numeric: tabular-nums; }
  .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; fill: var(--ink2); }
  .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .sub { font-size: 10.5px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 1; }
  .start { stroke: var(--s1); stroke-width: 1.5; }
  .startl { font-size: 11px; font-weight: 650; fill: var(--ink); }
  .mark { stroke: var(--ink2); stroke-width: 1.5; } .markd { fill: var(--muted); }
  .evl { font-size: 10.5px; fill: var(--ink2); }
  .seg { stroke: var(--surface); stroke-width: 1; }
  .hours { fill: var(--ink2); opacity: 0.55; }
  .bot { fill: var(--s1); } .agent { fill: var(--s2); } .other { fill: var(--s3); } .automation, .unknown { fill: var(--neutral); }
  .failed { fill: var(--failed); } .saved { fill: var(--good); }
  .line.saved { fill: none; stroke: var(--good); } .dot.saved { fill: var(--good); }
  .line.failedl { fill: none; stroke: var(--failed); } .dot.failedl { fill: var(--failed); }
  .partial { opacity: 0.5; }
  .line.cum { stroke: var(--s1); stroke-width: 2.5; } .dot.cum { fill: var(--s1); } .area { fill: var(--s1); opacity: 0.12; }
  .endl { font-size: 13px; font-weight: 650; fill: var(--s1); font-variant-numeric: tabular-nums; }
  .avg { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; } .avgl { font-size: 10.5px; font-weight: 600; fill: var(--ink2);
    paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .clip { font-size: 9.5px; fill: var(--ink2); } .vl { font-size: 9.5px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke: var(--ink2); stroke-width: 2; } .dot { fill: var(--ink2); stroke: var(--surface); stroke-width: 2; }
  .people { fill: #8b5cf6; } .agents { fill: var(--s1); } .bots { fill: var(--neutral); } .closed { fill: var(--good); }
  .dayband { fill: var(--tile); } .band { fill: var(--s1); opacity: 0.13; }
  .daily { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.5; }
  .noissue { font-size: 10.5px; font-weight: 650; fill: var(--failed); }

  .qs1 { stroke: var(--s1); } .qs2 { stroke: var(--s2); } .qs3 { stroke: var(--s3); } .qs4 { stroke: #8b5cf6; }
  .qn { stroke: var(--neutral); }
  .dot.qs1, .qs1k { fill: var(--s1); } .dot.qs2, .qs2k { fill: var(--s2); } .dot.qs3, .qs3k { fill: var(--s3); }
  .dot.qs4, .qs4k { fill: #8b5cf6; } .dot.qn, .qnk { fill: var(--neutral); }
  .dot.qs1, .dot.qs2, .dot.qs3, .dot.qs4, .dot.qn { stroke: var(--surface); stroke-width: 2; }
  .pend { stroke-dasharray: 4 4; stroke-width: 1.5; }
  .dot.open { fill: var(--surface); stroke-width: 2; } .dot.open.qs1 { stroke: var(--s1); } .dot.open.qs2 { stroke: var(--s2); }
  .dot.open.qs3 { stroke: var(--s3); } .dot.open.qs4 { stroke: #8b5cf6; } .dot.open.qn { stroke: var(--neutral); }
</style>
<g class="root">
  <rect class="bg" x="0.5" y="0.5" width="919" height="599" rx="10"/>
  <text class="h1" x="24" y="34">squid-protocol/gitgalaxy: PR quality by size</text>
  <text class="lead" x="24" y="54">How often a merged promoter-bot PR needed a fix (review send-back or CI fix run), by hand-written files changed, and what broke. Weekly.</text>
  <rect class="tile" x="24.0" y="78" width="209.0" height="70" rx="8"/>
  <text class="k" x="36.0" y="98">FIRST PASS</text>
  <text class="v" x="36.0" y="124">70%</text>
  <text class="sub" x="36.0" y="140">183 of 260 merged · +26 pts</text>
  <rect class="tile" x="245.0" y="78" width="209.0" height="70" rx="8"/>
  <text class="k" x="257.0" y="98">FIX RATE, 1-4 FILES</text>
  <text class="v" x="257.0" y="124">21%</text>
  <text class="sub" x="257.0" y="140">43 of 208 PRs · -13 pts</text>
  <rect class="tile" x="466.0" y="78" width="209.0" height="70" rx="8"/>
  <text class="k" x="478.0" y="98">FIX RATE, 5+ FILES</text>
  <text class="v" x="478.0" y="124">46%</text>
  <text class="sub" x="478.0" y="140">24 of 52 PRs · -21 pts</text>
  <rect class="tile" x="687.0" y="78" width="209.0" height="70" rx="8"/>
  <text class="k" x="699.0" y="98">TOP CAUSE</text>
  <text class="v" x="699.0" y="124">stale</text>
  <text class="sub" x="699.0" y="140">23 of 89 fix runs</text>
  <text class="meta" x="896" y="72" text-anchor="end">week of Oct 19</text>
  <text class="h2" x="24" y="174">Fix rate by PR size: share of merged PRs that needed a review send-back or CI fix run</text>
  <line class="base" x1="58" x2="746" y1="338.0" y2="338.0"/>
  <text class="tick" x="52" y="341.5" text-anchor="end">0%</text>
  <line class="grid" x1="58" x2="746" y1="308.0" y2="308.0"/>
  <text class="tick" x="52" y="311.5" text-anchor="end">10%</text>
  <line class="grid" x1="58" x2="746" y1="278.0" y2="278.0"/>
  <text class="tick" x="52" y="281.5" text-anchor="end">20%</text>
  <line class="grid" x1="58" x2="746" y1="248.0" y2="248.0"/>
  <text class="tick" x="52" y="251.5" text-anchor="end">30%</text>
  <line class="grid" x1="58" x2="746" y1="218.0" y2="218.0"/>
  <text class="tick" x="52" y="221.5" text-anchor="end">40%</text>
  <line class="grid" x1="58" x2="746" y1="188.0" y2="188.0"/>
  <text class="tick" x="52" y="191.5" text-anchor="end">50%</text>
  <text class="tick" x="58.0" y="353" text-anchor="middle">Oct 5</text>
  <text class="tick" x="402.0" y="353" text-anchor="middle">Oct 12</text>
  <text class="tick" x="746.0" y="353" text-anchor="middle">Oct 19</text>
  <polyline class="line qs1" points="402.0,209.4 746.0,278.6"/>
  <circle class="dot qs1" cx="402.0" cy="209.4" r="4"><title>Oct 12: 1-2 files: 3 of 7 merged PRs needed a fix</title></circle>
  <circle class="dot qs1" cx="746.0" cy="278.6" r="4"><title>Oct 19: 1-2 files: 21 of 106 merged PRs needed a fix</title></circle>
  <polyline class="line qs3" points="402.0,263.0 746.0,273.3"/>
  <circle class="dot qs3" cx="402.0" cy="263.0" r="4"><title>Oct 12: 3-4 files: 2 of 8 merged PRs needed a fix</title></circle>
  <circle class="dot qs3" cx="746.0" cy="273.3" r="4"><title>Oct 19: 3-4 files: 22 of 102 merged PRs needed a fix</title></circle>
  <circle class="dot qs2" cx="746.0" cy="192.3" r="4"><title>Oct 19: 5 files: 17 of 35 merged PRs needed a fix</title></circle>
  <circle class="dot qs4" cx="746.0" cy="214.5" r="4"><title>Oct 19: 6+ files: 7 of 17 merged PRs needed a fix</title></circle>
  <rect class="qs2k" x="756" y="187.3" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="195.8">5 files 49%</text>
  <rect class="qs4k" x="756" y="209.5" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="218.0">6+ files 41%</text>
  <rect class="qs3k" x="756" y="268.3" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="276.8">3-4 files 22%</text>
  <rect class="qs1k" x="756" y="281.3" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="289.8">1-2 files 20%</text>
  <text class="h2" x="24" y="378">What broke: fix runs per 100 merged PRs, by cause</text>
  <line class="base" x1="58" x2="746" y1="542.0" y2="542.0"/>
  <text class="tick" x="52" y="545.5" text-anchor="end">0</text>
  <line class="grid" x1="58" x2="746" y1="504.5" y2="504.5"/>
  <text class="tick" x="52" y="508.0" text-anchor="end">5</text>
  <line class="grid" x1="58" x2="746" y1="467.0" y2="467.0"/>
  <text class="tick" x="52" y="470.5" text-anchor="end">10</text>
  <line class="grid" x1="58" x2="746" y1="429.5" y2="429.5"/>
  <text class="tick" x="52" y="433.0" text-anchor="end">15</text>
  <line class="grid" x1="58" x2="746" y1="392.0" y2="392.0"/>
  <text class="tick" x="52" y="395.5" text-anchor="end">20</text>
  <text class="tick" x="58.0" y="557" text-anchor="middle">Oct 5</text>
  <text class="tick" x="402.0" y="557" text-anchor="middle">Oct 12</text>
  <text class="tick" x="746.0" y="557" text-anchor="middle">Oct 19</text>
  <polyline class="line qs1" points="402.0,500.3 746.0,475.7"/>
  <circle class="dot qs1" cx="402.0" cy="500.3" r="4"><title>Oct 12: derived file not refreshed: 1 fix runs per 18 merged PRs</title></circle>
  <circle class="dot qs1" cx="746.0" cy="475.7" r="4"><title>Oct 19: derived file not refreshed: 23 fix runs per 260 merged PRs</title></circle>
  <polyline class="line qs3" points="402.0,542.0 746.0,478.5"/>
  <circle class="dot qs3" cx="402.0" cy="542.0" r="4"><title>Oct 12: conflict with main: 0 fix runs per 18 merged PRs</title></circle>
  <circle class="dot qs3" cx="746.0" cy="478.5" r="4"><title>Oct 19: conflict with main: 22 fix runs per 260 merged PRs</title></circle>
  <polyline class="line qs2" points="402.0,417.0 746.0,504.5"/>
  <circle class="dot qs2" cx="402.0" cy="417.0" r="4"><title>Oct 12: broke other tests: 3 fix runs per 18 merged PRs</title></circle>
  <circle class="dot qs2" cx="746.0" cy="504.5" r="4"><title>Oct 19: broke other tests: 13 fix runs per 260 merged PRs</title></circle>
  <polyline class="line qs4" points="402.0,417.0 746.0,481.4"/>
  <circle class="dot qs4" cx="402.0" cy="417.0" r="4"><title>Oct 12: main red / flake / infra: 3 fix runs per 18 merged PRs</title></circle>
  <circle class="dot qs4" cx="746.0" cy="481.4" r="4"><title>Oct 19: main red / flake / infra: 21 fix runs per 260 merged PRs</title></circle>
  <polyline class="line qn" points="402.0,417.0 746.0,513.2"/>
  <circle class="dot qn" cx="402.0" cy="417.0" r="4"><title>Oct 12: own tests, review, other: 3 fix runs per 18 merged PRs</title></circle>
  <circle class="dot qn" cx="746.0" cy="513.2" r="4"><title>Oct 19: own tests, review, other: 10 fix runs per 260 merged PRs</title></circle>
  <rect class="qs1k" x="756" y="470.7" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="479.2">stale 9</text>
  <rect class="qs3k" x="756" y="483.7" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="492.2">conflict 8</text>
  <rect class="qs4k" x="756" y="496.7" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="505.2">env 8</text>
  <rect class="qs2k" x="756" y="509.7" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="518.2">collateral 5</text>
  <rect class="qnk" x="756" y="522.7" width="10" height="3" rx="1.5"/>
  <text class="lbl" x="772" y="531.2">other 4</text>
  <text class="meta" x="24" y="568">* this week so far (dashed, hollow point); a line is drawn where a week has 3 merged PRs or more. Tiles: the last full week, change on the week before.</text>
  <text class="meta" x="24" y="583">Causes are labelled by a model from each fix run&apos;s report (factory.json "quality", published by the orchestrator).</text>
</g>
</svg>
