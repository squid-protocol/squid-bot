  <text class="tick" x="623.4" y="416" text-anchor="middle">Oct 24</text>
  <text class="tick" x="716.0" y="416" text-anchor="middle">Oct 26</text>
  <polyline class="line qs1" points="114.3,397.0 160.6,338.0 206.9,341.6 253.1,357.9 299.4,361.6 345.7,359.8 392.0,358.4 438.3,358.1 484.6,356.4 530.9,358.0 577.1,357.1 623.4,353.7 669.7,352.1 716.0,351.6"><title>1-2 files, last 7 days: 99 of 463 merged PRs needed a fix</title></polyline>
  <polyline class="line qs3" points="114.3,264.2 160.6,269.5 206.9,268.0 253.1,278.2 299.4,284.7 345.7,300.8 392.0,307.2 438.3,316.2 484.6,320.8 530.9,325.5 577.1,335.5 623.4,334.4 669.7,340.4 716.0,343.5"><title>3-4 files, last 7 days: 71 of 282 merged PRs needed a fix</title></polyline>
  <polyline class="line qs2" points="253.1,366.6 299.4,277.5 345.7,290.8 392.0,276.3 438.3,277.2 484.6,278.6 530.9,283.9 577.1,283.8 623.4,298.8 669.7,299.2 716.0,309.6"><title>5 files, last 7 days: 37 of 90 merged PRs needed a fix</title></polyline>
  <polyline class="line qs4" points="68.0,302.6 114.3,318.7 160.6,306.7 206.9,278.9 253.1,273.0 299.4,274.0 345.7,277.3 392.0,278.0 438.3,274.9 484.6,264.2 530.9,273.6 577.1,276.1 623.4,275.6 669.7,263.8 716.0,268.9"><title>6+ files, last 7 days: 41 of 68 merged PRs needed a fix</title></polyline>
  <rect class="qs4k" x="726" y="266.9" width="12" height="4" rx="2"/>
