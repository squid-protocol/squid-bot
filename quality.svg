<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 729" width="920" height="729" role="img" aria-label="squid-protocol/gitgalaxy PR quality by size">
<style>
  .root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
          --axis:#c3c2b7; --border:rgba(11,11,11,0.10); --tile:#f4f3f0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
          --neutral:#c3c2b7; --failed:#d03b3b; --good:#0ca30c; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
            --axis:#383835; --border:rgba(255,255,255,0.10); --tile:#232322; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
            --neutral:#5c5c58; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .bg { fill: var(--surface); stroke: var(--border); }
  .tile { fill: var(--tile); }
  .h1 { font-size: 16px; font-weight: 650; }
  .lead { font-size: 12.5px; fill: var(--ink2); }
  .h2 { font-size: 12.5px; font-weight: 600; }
  .meta, .tick, .lbl { font-size: 10.5px; fill: var(--muted); }
  .tick { font-variant-numeric: tabular-nums; }
  .k { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; fill: var(--ink2); }
  .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .sub { font-size: 10.5px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--axis); stroke-width: 1; }
  .start { stroke: var(--s1); stroke-width: 1.5; }
  .startl { font-size: 11px; font-weight: 650; fill: var(--ink); }
  .mark { stroke: var(--ink2); stroke-width: 1.5; } .markd { fill: var(--muted); }
  .evl { font-size: 10.5px; fill: var(--ink2); }
  .seg { stroke: var(--surface); stroke-width: 1; }
  .hours { fill: var(--ink2); opacity: 0.55; }
  .bot { fill: var(--s1); } .agent { fill: var(--s2); } .other { fill: var(--s3); } .automation, .unknown { fill: var(--neutral); }
  .failed { fill: var(--failed); } .saved { fill: var(--good); }
  .line.saved { fill: none; stroke: var(--good); } .dot.saved { fill: var(--good); }
  .line.failedl { fill: none; stroke: var(--failed); } .dot.failedl { fill: var(--failed); }
  .partial { opacity: 0.5; }
  .line.cum { stroke: var(--s1); stroke-width: 2.5; } .dot.cum { fill: var(--s1); } .area { fill: var(--s1); opacity: 0.12; }
  .endl { font-size: 13px; font-weight: 650; fill: var(--s1); font-variant-numeric: tabular-nums; }
  .avg { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; } .avgl { font-size: 10.5px; font-weight: 600; fill: var(--ink2);
    paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .clip { font-size: 9.5px; fill: var(--ink2); } .vl { font-size: 9.5px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke: var(--ink2); stroke-width: 2; } .dot { fill: var(--ink2); stroke: var(--surface); stroke-width: 2; }
  .people { fill: #8b5cf6; } .agents { fill: var(--s1); } .bots { fill: var(--neutral); } .closed { fill: var(--good); }
  .dayband { fill: var(--tile); } .band { fill: var(--s1); opacity: 0.13; }
  .daily { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.5; }
  .noissue { font-size: 10.5px; font-weight: 650; fill: var(--failed); }

  .h1 { font-size: 19px; font-weight: 750; } .h2 { font-size: 15px; font-weight: 700; }
  .lead { font-size: 13.5px; font-weight: 600; } .meta { font-size: 12px; font-weight: 600; }
  .tick { font-size: 13px; font-weight: 700; fill: var(--ink2); } .lbl { font-size: 14.5px; font-weight: 750; fill: var(--ink); }
  .k { font-size: 12px; font-weight: 750; } .v { font-size: 25px; font-weight: 750; } .sub { font-size: 12.5px; font-weight: 600; }
  .line { stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .qs1 { stroke: var(--s1); } .qs2 { stroke: var(--s2); } .qs3 { stroke: var(--s3); } .qs4 { stroke: #8b5cf6; }
  .qn { stroke: var(--neutral); }
  .qs1k { fill: var(--s1); } .qs2k { fill: var(--s2); } .qs3k { fill: var(--s3); } .qs4k { fill: #8b5cf6; } .qnk { fill: var(--neutral); }
</style>
<g class="root">
  <rect class="bg" x="0.5" y="0.5" width="919" height="728" rx="10"/>
  <text class="h1" x="24" y="36">squid-protocol/gitgalaxy: PR quality by size</text>
  <text class="lead" x="24" y="58">How often a merged promoter-bot PR needed a fix (review send-back or CI fix run), by hand-written files changed.</text>
  <text class="lead" x="24" y="77">All hosts, rolling 7 days, a new point every day.</text>
  <rect class="tile" x="24.0" y="105" width="209.0" height="76" rx="8"/>
  <text class="k" x="36.0" y="126">FIRST PASS</text>
  <text class="v" x="36.0" y="154">60%</text>
  <text class="sub" x="36.0" y="172">567 of 948 merged · -12 pts</text>
  <rect class="tile" x="245.0" y="105" width="209.0" height="76" rx="8"/>
  <text class="k" x="257.0" y="126">FIX RATE, 1-4 FILES</text>
  <text class="v" x="257.0" y="154">23%</text>
  <text class="sub" x="257.0" y="172">180 of 781 PRs · +5 pts</text>
  <rect class="tile" x="466.0" y="105" width="209.0" height="76" rx="8"/>
  <text class="k" x="478.0" y="126">FIX RATE, 5+ FILES</text>
  <text class="v" x="478.0" y="154">53%</text>
  <text class="sub" x="478.0" y="172">88 of 167 PRs · +33 pts</text>
  <rect class="tile" x="687.0" y="105" width="209.0" height="76" rx="8"/>
  <text class="k" x="699.0" y="126">TOP CAUSE</text>
  <text class="v" x="699.0" y="154">stale</text>
  <text class="sub" x="699.0" y="172">114 of 393 fix runs</text>
  <text class="meta" x="896" y="97" text-anchor="end">7 days Oct 19 – Oct 25</text>
  <text class="h2" x="24" y="209">Fix rate by PR size: share of merged PRs that needed a review send-back or CI fix run</text>
  <line class="base" x1="68" x2="716" y1="397.0" y2="397.0"/>
  <text class="tick" x="60" y="401.5" text-anchor="end">0%</text>
  <line class="grid" x1="68" x2="716" y1="354.5" y2="354.5"/>
  <text class="tick" x="60" y="359.0" text-anchor="end">20%</text>
  <line class="grid" x1="68" x2="716" y1="312.0" y2="312.0"/>
  <text class="tick" x="60" y="316.5" text-anchor="end">40%</text>
  <line class="grid" x1="68" x2="716" y1="269.5" y2="269.5"/>
  <text class="tick" x="60" y="274.0" text-anchor="end">60%</text>
  <line class="grid" x1="68" x2="716" y1="227.0" y2="227.0"/>
  <text class="tick" x="60" y="231.5" text-anchor="end">80%</text>
  <text class="tick" x="117.8" y="416" text-anchor="middle">Oct 13</text>
  <text class="tick" x="217.5" y="416" text-anchor="middle">Oct 15</text>
  <text class="tick" x="317.2" y="416" text-anchor="middle">Oct 17</text>
  <text class="tick" x="416.9" y="416" text-anchor="middle">Oct 19</text>
  <text class="tick" x="516.6" y="416" text-anchor="middle">Oct 21</text>
  <text class="tick" x="616.3" y="416" text-anchor="middle">Oct 23</text>
  <text class="tick" x="716.0" y="416" text-anchor="middle">Oct 25</text>
  <polyline class="line qs1" points="117.8,397.0 167.7,397.0 217.5,397.0 267.4,397.0 317.2,380.7 367.1,370.6 416.9,366.3 466.8,364.7 516.6,358.0 566.5,358.6 616.3,357.1 666.2,353.7 716.0,352.1"><title>1-2 files, last 7 days: 103 of 488 merged PRs needed a fix</title></polyline>
  <polyline class="line qs3" points="117.8,397.0 167.7,397.0 217.5,397.0 267.4,384.5 317.2,352.9 367.1,338.8 416.9,334.7 466.8,334.7 516.6,328.2 566.5,326.5 616.3,336.3 666.2,335.1 716.0,341.2"><title>3-4 files, last 7 days: 77 of 293 merged PRs needed a fix</title></polyline>
  <polyline class="line qs2" points="267.4,397.0 317.2,304.0 367.1,304.0 416.9,285.9 466.8,285.0 516.6,285.5 566.5,289.4 616.3,286.1 666.2,298.8 716.0,299.2"><title>5 files, last 7 days: 46 of 100 merged PRs needed a fix</title></polyline>
  <polyline class="line qs4" points="68.0,397.0 117.8,397.0 167.7,397.0 217.5,397.0 267.4,389.4 317.2,376.9 367.1,372.2 416.9,367.2 466.8,363.1 516.6,341.2 566.5,311.3 616.3,276.1 666.2,275.6 716.0,263.8"><title>6+ files, last 7 days: 42 of 67 merged PRs needed a fix</title></polyline>
  <rect class="qs4k" x="726" y="261.8" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="268.8">6+ files 63%</text>
  <rect class="qs2k" x="726" y="297.2" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="304.2">5 files 46%</text>
  <rect class="qs3k" x="726" y="339.2" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="346.2">3-4 files 26%</text>
  <rect class="qs1k" x="726" y="357.2" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="364.2">1-2 files 21%</text>
  <text class="h2" x="24" y="445">What broke: fix runs per 100 merged PRs, by cause</text>
  <line class="base" x1="68" x2="716" y1="633.0" y2="633.0"/>
  <text class="tick" x="60" y="637.5" text-anchor="end">0</text>
  <line class="grid" x1="68" x2="716" y1="576.3" y2="576.3"/>
  <text class="tick" x="60" y="580.8" text-anchor="end">5</text>
  <line class="grid" x1="68" x2="716" y1="519.7" y2="519.7"/>
  <text class="tick" x="60" y="524.2" text-anchor="end">10</text>
  <line class="grid" x1="68" x2="716" y1="463.0" y2="463.0"/>
  <text class="tick" x="60" y="467.5" text-anchor="end">15</text>
  <text class="tick" x="117.8" y="652" text-anchor="middle">Oct 13</text>
  <text class="tick" x="217.5" y="652" text-anchor="middle">Oct 15</text>
