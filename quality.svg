  <text class="v" x="36.0" y="154">58%</text>
  <text class="sub" x="36.0" y="172">505 of 869 merged · +6 pts</text>
  <rect class="tile" x="245.0" y="105" width="209.0" height="76" rx="8"/>
  <text class="k" x="257.0" y="126">FIX RATE, 1-4 FILES</text>
  <text class="v" x="257.0" y="154">22%</text>
  <text class="sub" x="257.0" y="172">162 of 723 PRs · -4 pts</text>
