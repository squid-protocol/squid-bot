  <polyline class="line qs3" points="111.2,264.2 154.4,269.5 197.6,268.0 240.8,278.2 284.0,284.7 327.2,300.8 370.4,307.2 413.6,316.2 456.8,320.8 500.0,325.5 543.2,335.5 586.4,334.4 629.6,340.4 672.8,343.5 716.0,345.5"><title>3-4 files, last 7 days: 64 of 264 merged PRs needed a fix</title></polyline>
