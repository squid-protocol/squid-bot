  <text class="tick" x="716.0" y="652" text-anchor="middle">Oct 26</text>
  <polyline class="line qs1" points="68.0,558.0 114.3,575.6 160.6,596.3 206.9,586.2 253.1,583.5 299.4,578.6 345.7,579.7 392.0,581.7 438.3,584.2 484.6,575.9 530.9,574.0 577.1,578.7 623.4,582.6 669.7,581.9 716.0,583.1"><title>derived file not refreshed, last 7 days: 106 fix runs per 903 merged PRs</title></polyline>
  <polyline class="line qs3" points="68.0,583.0 114.3,587.1 160.6,591.0 206.9,593.4 253.1,599.1 299.4,596.1 345.7,600.6 392.0,602.6 438.3,603.7 484.6,601.5 530.9,603.2 577.1,603.2 623.4,591.0 669.7,587.7 716.0,587.8"><title>conflict with main, last 7 days: 96 fix runs per 903 merged PRs</title></polyline>
  <polyline class="line qs2" points="68.0,533.0 114.3,587.1 160.6,580.5 206.9,561.0 253.1,562.6 299.4,573.3 345.7,580.9 392.0,589.3 438.3,594.0 484.6,597.2 530.9,604.5 577.1,603.8 623.4,603.4 669.7,605.2 716.0,605.7"><title>broke other tests, last 7 days: 58 fix runs per 903 merged PRs</title></polyline>
  <polyline class="line qs4" points="68.0,633.0 114.3,621.5 160.6,559.5 206.9,499.7 253.1,533.9 299.4,550.5 345.7,570.5 392.0,569.3 438.3,567.2 484.6,560.6 530.9,579.7 577.1,586.5 623.4,594.6 669.7,592.2 716.0,594.4"><title>main red / flake / infra, last 7 days: 82 fix runs per 903 merged PRs</title></polyline>
