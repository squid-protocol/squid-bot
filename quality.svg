  <polyline class="line qs1" points="68.0,558.0 111.2,575.6 154.4,596.3 197.6,586.2 240.8,583.5 284.0,578.6 327.2,579.7 370.4,581.7 413.6,584.2 456.8,575.9 500.0,574.0 543.2,578.7 586.4,582.6 629.6,581.9 672.8,583.1 716.0,581.6"><title>derived file not refreshed, last 7 days: 105 fix runs per 869 merged PRs</title></polyline>
  <polyline class="line qs3" points="68.0,583.0 111.2,587.1 154.4,591.0 197.6,593.4 240.8,599.1 284.0,596.1 327.2,600.6 370.4,602.6 413.6,603.7 456.8,601.5 500.0,603.2 543.2,603.2 586.4,591.0 629.6,587.7 672.8,587.8 716.0,587.0"><title>conflict with main, last 7 days: 94 fix runs per 869 merged PRs</title></polyline>
  <polyline class="line qs2" points="68.0,533.0 111.2,587.1 154.4,580.5 197.6,561.0 240.8,562.6 284.0,573.3 327.2,580.9 370.4,589.3 413.6,594.0 456.8,597.2 500.0,604.5 543.2,603.8 586.4,603.4 629.6,605.2 672.8,605.7 716.0,605.6"><title>broke other tests, last 7 days: 56 fix runs per 869 merged PRs</title></polyline>
