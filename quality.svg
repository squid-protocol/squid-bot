  <text class="meta" x="24" y="675">Each day is the 7 days ending on it (fewer at the start); a size line is drawn where that window has 5 merged PRs or more.</text>
  <text class="meta" x="24" y="693">Tiles: the last 7 days, change on the 7 before. Causes are labelled by a model from each fix run&apos;s report.</text>
  <text class="meta" x="24" y="711">Data: factory.json "quality", summed over every orchestrator host.</text>
