  <polyline class="line qs1" points="68.0,558.0 108.5,575.6 149.0,596.3 189.5,586.2 230.0,583.5 270.5,578.6 311.0,579.7 351.5,581.7 392.0,584.2 432.5,575.9 473.0,574.0 513.5,578.7 554.0,582.6 594.5,581.9 635.0,583.1 675.5,581.6 716.0,588.4"><title>derived file not refreshed, last 7 days: 91 fix runs per 867 merged PRs</title></polyline>
  <polyline class="line qs3" points="68.0,583.0 108.5,587.1 149.0,591.0 189.5,593.4 230.0,599.1 270.5,596.1 311.0,600.6 351.5,602.6 392.0,603.7 432.5,601.5 473.0,603.2 513.5,603.2 554.0,591.0 594.5,587.7 635.0,587.8 675.5,587.0 716.0,585.9"><title>conflict with main, last 7 days: 96 fix runs per 867 merged PRs</title></polyline>
