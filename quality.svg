  <text class="tick" x="516.6" y="652" text-anchor="middle">Oct 21</text>
  <text class="tick" x="616.3" y="652" text-anchor="middle">Oct 23</text>
  <text class="tick" x="716.0" y="652" text-anchor="middle">Oct 25</text>
  <polyline class="line qs1" points="68.0,633.0 117.8,633.0 167.7,633.0 217.5,633.0 267.4,626.0 317.2,572.1 367.1,546.5 416.9,534.1 466.8,531.2 516.6,502.3 566.5,484.1 616.3,488.2 666.2,498.7 716.0,496.7"><title>derived file not refreshed, last 7 days: 114 fix runs per 948 merged PRs</title></polyline>
  <polyline class="line qs3" points="68.0,633.0 117.8,633.0 167.7,633.0 217.5,633.0 267.4,633.0 317.2,595.5 367.1,586.7 416.9,579.8 466.8,574.5 516.6,558.9 566.5,556.9 616.3,553.6 666.2,521.1 716.0,512.3"><title>conflict with main, last 7 days: 101 fix runs per 948 merged PRs</title></polyline>
  <polyline class="line qs2" points="68.0,633.0 117.8,633.0 167.7,633.0 217.5,633.0 267.4,605.2 317.2,586.2 367.1,568.1 416.9,567.1 466.8,572.3 516.6,564.7 566.5,563.6 616.3,556.4 666.2,554.1 716.0,558.9"><title>broke other tests, last 7 days: 62 fix runs per 948 merged PRs</title></polyline>
  <polyline class="line qs4" points="68.0,633.0 117.8,633.0 167.7,633.0 217.5,633.0 267.4,633.0 317.2,590.9 367.1,583.6 416.9,562.0 466.8,539.8 516.6,488.7 566.5,494.3 616.3,510.5 666.2,531.7 716.0,525.4"><title>main red / flake / infra, last 7 days: 90 fix runs per 948 merged PRs</title></polyline>
  <polyline class="line qn" points="68.0,633.0 117.8,633.0 167.7,633.0 217.5,633.0 267.4,619.1 317.2,600.2 367.1,592.9 416.9,577.2 466.8,581.0 516.6,584.2 566.5,585.6 616.3,589.8 666.2,597.7 716.0,601.9"><title>own tests, review, other, last 7 days: 26 fix runs per 948 merged PRs</title></polyline>
  <rect class="qs1k" x="726" y="494.7" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="501.7">stale 12</text>
  <rect class="qs3k" x="726" y="512.7" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="519.7">conflict 11</text>
