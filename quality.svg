  <rect class="qs1k" x="726" y="581.1" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="588.1">stale 12</text>
  <rect class="qs3k" x="726" y="599.1" width="12" height="4" rx="2"/>
  <text class="lbl" x="744" y="606.1">conflict 11</text>
