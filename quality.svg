  <text class="tick" x="60" y="401.5" text-anchor="end">0%</text>
  <line class="grid" x1="68" x2="716" y1="354.5" y2="354.5"/>
  <text class="tick" x="60" y="359.0" text-anchor="end">20%</text>
  <line class="grid" x1="68" x2="716" y1="312.0" y2="312.0"/>
