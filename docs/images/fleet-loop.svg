<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 748" width="1040" height="748" role="img" aria-labelledby="t d">
<title id="t">squid-bot: from issue to verified main</title>
<desc id="d">Issues submitted and owner goals feed promoter-bot, which starts agents in isolated worktrees when box-status allows. Agents open draft PRs. shepherd_gh reads their state: a failed check goes to ci_digest, which sends an exact local repro back to the agent; a green PR goes to integrase-bot, which updates main. A merge frees a slot for the next slice. Sessions hand off to memory, and comms-bot carries owner questions and decisions.</desc>
<style>
  svg { --bg:#fcfcfb; --tile:#f4f3f0; --ink:#0b0b0b; --ink2:#52514e; --muted:#7a7874; --line:#d9d7d0; --arrow:#6b6a65;
    --c1:#2a78d6; --c2:#1baf7a; --c3:#6250d6; --c4:#a8a69e; --c5:#d55181; --ok:#0a7d3c; --oktext:#ffffff; --start:#e8eefa; --startline:#2a78d6; }
  @media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --tile:#1b2028; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --line:#30363d; --arrow:#9a9892;
    --c1:#3987e5; --c2:#199e70; --c3:#9085e9; --c4:#6e6d68; --c5:#e87ba4; --ok:#1a8f4d; --oktext:#ffffff; --start:#16243a; --startline:#3987e5; } }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .bg { fill: var(--bg); } .panel { fill: none; stroke: var(--line); stroke-width: 1; }
  .bar { fill: none; stroke-width: 3; stroke-linecap: round; } .c1 { stroke: var(--c1); } .c2 { stroke: var(--c2); } .c3 { stroke: var(--c3); } .c4 { stroke: var(--c4); } .c5 { stroke: var(--c5); }
  .node { fill: var(--tile); stroke: var(--line); } .start { fill: var(--start); stroke: var(--startline); } .end { fill: var(--ok); stroke: none; }
  .h1 { font-size: 24px; font-weight: 700; } .sub { font-size: 14px; fill: var(--ink2); }
  .ph { font-size: 14.5px; font-weight: 700; } .ps { font-size: 12px; fill: var(--muted); }
  .tm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
  .tt { font-size: 14px; font-weight: 700; } .td { font-size: 12px; fill: var(--ink2); }
  .end + .tt, .end + .tt + .td { fill: var(--oktext); } .end + .tt { font-size: 19px; } .end + .tt + .td { font-size: 13px; }
  .a { fill: none; stroke: var(--arrow); stroke-width: 1.6; } .back { stroke: var(--c3); } .dash { stroke-dasharray: 5 4; }
  .h { fill: var(--arrow); }
  .l { font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
<defs>
