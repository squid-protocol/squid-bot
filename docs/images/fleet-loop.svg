<text class="tm" x="174.0" y="215.0" text-anchor="middle">promoter-bot</text>
<text class="td" x="174.0" y="233.0" text-anchor="middle">Decides what, when, how many</text>
<text class="td" x="174.0" y="249.0" text-anchor="middle">inducible promoter</text>
<rect class="node" x="108" y="316" width="190" height="80" rx="8"/>
<text class="tm" x="203.0" y="345.0" text-anchor="middle">box-status</text>
<text class="td" x="203.0" y="363.0" text-anchor="middle">Senses host pressure</text>
