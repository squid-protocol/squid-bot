[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-bot"
version = "0.1.0"
description = "Gene editing for codebases: host admission, CI screening and verified integration (integrase-bot) for AI coding fleets"
readme = "README.md"
authors = [
    { name = "Joe Esquibel", email = "joe.m.esquibel@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
squid-bot = "squid_bot.ci_shepherd:main"
shepherd = "squid_bot.ci_shepherd:main"
integrase-bot = "squid_bot.ci_shepherd:main"
box-status = "squid_bot.box_status:main"
ci-digest = "squid_bot.ci_digest:main"
pr-check = "squid_bot.pr_check:main"
flake-history = "squid_bot.flake_history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
