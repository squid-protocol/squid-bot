# squid-bot configuration file (squid-bot.toml), searched from the current directory upward

[repository]
# The GitHub repository to work on, "owner/repo". There is no default: without this, $SQUID_BOT_REPO or
# $GITHUB_REPOSITORY is used, then the checkout `gh repo view` recognises.
slug = "owner/repo"

[integrase]
# The merge bot (formerly "shepherd"; a [shepherd] section is still read). It merges a PR labelled shepherd:merge once
# the checks the repository's own rules on `main` require are green, so the required checks are set on GitHub, not here.

# Seconds between passes of `integrase-bot run` (default: 600 = 10 min)
poll_interval_seconds = 600

# Where the merge queue's state is kept (default: ~/.local/state/squid-bot/integrase.json)
# state_path = "~/.local/state/squid-bot/integrase.json"

[supervisor]
# Directory for the slot and exclusive flock files
lock_dir = "/tmp/squid-bot/locks"

# Maximum heavy-run slots (defaults to nproc / 4)
# heavy_slots = 3

[repro]
# The local command `ci-digest` prints for a failed check. {tests} is the failing test ids, {cases} the failing cases.
default = "python -m pytest -q {tests}"
# Checks with no local equivalent (matched at the start of the check's name)
no_local = ["CodeQL", "Analyze"]

[repro.rules]
# check-name regex = command, tried in order before `default`
"^lint$" = "ruff check ."
