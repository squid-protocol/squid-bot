name: Runner occupancy

# One runner-occupancy reading of every squid-protocol repo (jobs holding a runner right now), appended to
# occupancy.jsonl on the `dashboard` branch. The Dashboard workflow turns the readings into each day's runner hours
# (time-weighted, so a day can never exceed the pool).
# Manual only since 2026-10-25: the readings come from a host every 15 min (scripts/occupancy-sampler.sh, systemd
# timer in templates/systemd/). On its */15 schedule this workflow ran 7 times in 22 h (GitHub drops scheduled runs
# under load), waited up to 28 min for a runner from the pool it measures, so it missed the saturated hours, and
# counted its own job. Run it by hand only to take a reading when no host sampler is running.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-occupancy
  cancel-in-progress: false

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/fleet-report
        with:
          repo: squid-protocol/gitgalaxy
          occupancy-sample: "true"
          occupancy-scope: org  # owner policy 2026-10-24: every squid-protocol repo shares the 20 runners
          # FLEET_REPORT_TOKEN (actions:read on the org's private repos) when set; GITHUB_TOKEN sees the public ones
          token: ${{ secrets.FLEET_REPORT_TOKEN || github.token }}
