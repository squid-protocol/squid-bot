name: Fleet CI report
description: >-
  A live dashboard and weekly report of what an agent bot changed: delivery, queue wait, CI cost and CI waste per day,
  before and with the bot.
author: squid-protocol
branding:
  icon: activity
  color: blue

inputs:
  repo:
    description: Repository to measure (owner/repo). Defaults to the repository running the workflow.
    default: ${{ github.repository }}
  token:
    description: >-
      Token that can read the measured repo's Actions, PRs and commits, and push to `branch` of the repository
      running the workflow. The default GITHUB_TOKEN works for public repos and for the repo itself
      (needs `permissions: contents: write` to publish).
    default: ${{ github.token }}
  branch:
    description: Branch of this repository to publish dashboard.svg, limits.svg, quality.svg and metrics.json to. Empty = don't publish.
    default: dashboard
  days:
    description: Days shown on the dashboard.
    default: "30"
  title:
    description: 'Dashboard and report heading. Default "<repo>: CI activity".'
    default: ""
  bot-workflows:
    description: Comma-separated workflow names that are an orchestrator's own bookkeeping (counted as a share of runs).
    default: ""
  agent-branch-prefixes:
    description: Comma-separated head-branch prefixes that mark a PR as agent-made. Replaces the default list.
    default: "claude/,codex/,copilot/,cursor/,devin/"
  agent-markers:
    description: Regex matched against PR bodies that marks a PR as agent-made. Empty = the built-in list (Claude Code, Copilot, Devin, Cursor, Codex, Gemini CLI trailers).
    default: ""
  bot-branch-prefixes:
    description: >-
      Comma-separated head-branch prefixes of the bot this dashboard follows (e.g. your orchestrator's worker branches).
      Its PRs get their own class, and the charts show the days before it and with it. Empty = no bot.
    default: ""
  bot-name:
    description: Name shown for the bot.
    default: "bot"
  bot-start:
    description: YYYY-MM-DD the bot went live. Empty = the day of its first merged PR.
    default: ""
  events:
    description: "Dates to mark on the charts, as 'YYYY-MM-DD: label; YYYY-MM-DD: label'."
    default: ""
  sample-fraction:
    description: >-
      Share of each day's completed runs measured for queue wait and runner time (one API call each), stratified by
      workflow across the whole day. A fraction, not a count, so precision holds as volume grows.
    default: "0.05"
  sample-min:
    description: Fewest runs measured a day.
    default: "30"
  sample-budget:
    description: New run lookups per invocation across all days; the rest of a day's sample is taken on later runs.
    default: "400"
  sample-runs:
    description: Deprecated (the old fixed per-day sample); when set it is read as sample-min.
    default: ""
  runner-pool:
    description: Concurrent runners available (e.g. 20). A dotted line on the CI hours chart marks pool x 24 h, and a day's runner time above it is reported as an estimate fault.
    default: ""
  occupancy-scope:
    description: >-
      "org" (default) = count every repository of the owner, since they share the hosted-runner pool; "repo" = `repo`
      only. A token that can read Actions on the owner's private repos is needed to see those (GITHUB_TOKEN sees public ones).
    default: "org"
  occupancy-sample:
    description: >-
      "true" = take one runner-occupancy reading (jobs running now), append it to occupancy.jsonl on `branch` and stop.
      Run it from its own schedule every ~15 min; the report then measures runner time from these readings.
    default: "false"
  detail-backfill:
    description: Older days to fill with the sampled detail per run (about 30 API calls each).
    default: "4"
  max-wait-p90:
    description: Warn when the 7-day average p90 job queue wait (minutes) exceeds this. Empty = off.
    default: ""
  max-runner-hours-per-pr:
    description: Warn when 7-day runner hours per merged PR exceed this. Empty = off.
    default: ""
  cost-max:
    description: Top of the cost-per-merged-PR chart axis, in runner hours; days above it are drawn at the top and marked. Empty = fit the data.
    default: ""
  red-main-label:
    description: Issue label a main-watch workflow opens when a check fails on main; the change-failure panel counts these per merged PR. Empty = no change-failure panel.
    default: ""
  fail-on-alert:
    description: Fail the step when an alert fires.
    default: "false"

outputs:
  dashboard-url:
    description: Raw URL of the published dashboard.svg (empty when not published).
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: Check out the publish branch (or start it)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        OUT: ${{ runner.temp }}/fleet-report
      run: |
        mkdir -p "$OUT" && cd "$OUT"
        if [ -n "$BRANCH" ]; then
          git init -q -b "$BRANCH"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin "$BRANCH" 2>/dev/null; then git checkout -q -B "$BRANCH" FETCH_HEAD; fi
        fi

    - name: Measure and render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUT: ${{ runner.temp }}/fleet-report
        I_REPO: ${{ inputs.repo }}
        I_DAYS: ${{ inputs.days }}
        I_TITLE: ${{ inputs.title }}
        I_BOTS: ${{ inputs.bot-workflows }}
        I_PREFIXES: ${{ inputs.agent-branch-prefixes }}
        I_MARKERS: ${{ inputs.agent-markers }}
        I_SAMPLE: ${{ inputs.sample-runs }}
        I_FRACTION: ${{ inputs.sample-fraction }}
        I_SAMPLE_MIN: ${{ inputs.sample-min }}
        I_SAMPLE_BUDGET: ${{ inputs.sample-budget }}
        I_POOL: ${{ inputs.runner-pool }}
        I_OCC: ${{ inputs.occupancy-sample }}
        I_OCC_SCOPE: ${{ inputs.occupancy-scope }}
        I_BOT_PREFIXES: ${{ inputs.bot-branch-prefixes }}
        I_BOT_NAME: ${{ inputs.bot-name }}
        I_BOT_START: ${{ inputs.bot-start }}
        I_EVENTS: ${{ inputs.events }}
        I_BACKFILL: ${{ inputs.detail-backfill }}
        I_MAX_WAIT: ${{ inputs.max-wait-p90 }}
        I_MAX_H: ${{ inputs.max-runner-hours-per-pr }}
        I_FAIL: ${{ inputs.fail-on-alert }}
        I_COST_MAX: ${{ inputs.cost-max }}
        I_RED_MAIN: ${{ inputs.red-main-label }}
      run: |
        if [ "$I_OCC" = "true" ]; then
          exec python3 "$GITHUB_ACTION_PATH/fleet_report.py" --repo "$I_REPO" --out "$OUT" --occupancy-sample --occupancy-scope "$I_OCC_SCOPE"
        fi
        args=(--repo "$I_REPO" --days "$I_DAYS" --out "$OUT" --title "$I_TITLE" --bot-workflows "$I_BOTS"
              --agent-branch-prefixes "$I_PREFIXES" --sample-fraction "$I_FRACTION" --sample-min "$I_SAMPLE_MIN"
              --sample-budget "$I_SAMPLE_BUDGET" --runner-pool "$I_POOL" --detail-backfill "$I_BACKFILL"
              --max-wait-p90 "$I_MAX_WAIT" --max-runner-hours-per-pr "$I_MAX_H" --summary "$GITHUB_STEP_SUMMARY"
              --bot-branch-prefixes "$I_BOT_PREFIXES" --bot-name "$I_BOT_NAME" --bot-start "$I_BOT_START" --events "$I_EVENTS"
              --cost-max "$I_COST_MAX" --red-main-label "$I_RED_MAIN")
        [ -n "$I_MARKERS" ] && args+=(--agent-markers "$I_MARKERS")
        [ -n "$I_SAMPLE" ] && args+=(--sample-runs "$I_SAMPLE")
        [ "$I_FAIL" = "true" ] && args+=(--fail-on-alert)
        python3 "$GITHUB_ACTION_PATH/fleet_report.py" "${args[@]}"

    - name: Publish
      id: publish
      if: ${{ always() && inputs.branch != '' }}
      shell: bash
      working-directory: ${{ runner.temp }}/fleet-report
      env:
        BRANCH: ${{ inputs.branch }}
        # each mode commits only the files it wrote: the occupancy sampler must never put back an older metrics.json
        FILES: ${{ inputs.occupancy-sample == 'true' && 'occupancy.jsonl' || 'dashboard.svg metrics.json' }}
        # drawn only when the orchestrator's factory.json has the data for them
        OPTIONAL: ${{ inputs.occupancy-sample == 'true' && '' || 'limits.svg quality.svg goals.svg' }}
      run: |
        for f in $FILES; do [ -f "$f" ] || exit 0; done
        for f in $OPTIONAL; do [ -f "$f" ] && FILES="$FILES $f"; done
        git add $FILES
        if ! git diff --cached --quiet; then
          for try in 1 2 3; do
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "fleet report: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin "$BRANCH" && break
            # another writer (an orchestrator publishing factory.json) moved the branch: put only OUR files on its tip
            git fetch -q --depth=1 origin "$BRANCH" && git reset -q --mixed FETCH_HEAD && git add $FILES
            git diff --cached --quiet && break
          done
        fi
        echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/dashboard.svg" >> "$GITHUB_OUTPUT"
